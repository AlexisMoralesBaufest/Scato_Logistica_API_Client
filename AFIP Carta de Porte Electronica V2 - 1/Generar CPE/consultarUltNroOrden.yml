info:
  name: consultarUltNroOrden
  type: http
  seq: 2

http:
  method: POST
  url: "{{CpeEndPointBaseUrl}}/wscpe/services/soap"
  headers:
    - name: Content-Type
      value: text/xml; charset=utf-8
    - name: SOAPAction
      value: https://serviciosjava.afip.gob.ar/wscpe/consultarUltNroOrden
  body:
    type: xml
    data: |-
      <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:wsc="https://serviciosjava.afip.gob.ar/wscpe/">
         <soapenv:Header/>
         <soapenv:Body>
            <wsc:ConsultarUltNroOrdenReq>
               <auth>
                  <token>{{TOKEN}}</token>
                  <sign>{{SIGN}}</sign>
                  <cuitRepresentada>30715118773</cuitRepresentada>
               </auth>
               <solicitud>
                  <sucursal>10</sucursal>
                  <tipoCPE>74</tipoCPE>
               </solicitud>
            </wsc:ConsultarUltNroOrdenReq>
         </soapenv:Body>
      </soapenv:Envelope>
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const xml = res.getBody();
        const match = xml.match(/<nroOrden>(.*?)<\/nroOrden>/);
        if(match){
          var nOrden = match[1];
          console.log(nOrden);
          var orden = ++nOrden;
          bru.setEnvVar("ORDEN", orden);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

