info:
  name: autorizarCPEAutomotor ACPEA Copy
  type: http
  seq: 4

http:
  method: POST
  url: "{{CpeEndPointBaseUrl}}/wscpe/services/soap"
  headers:
    - name: Content-Type
      value: text/xml; charset=utf-8
    - name: SOAPAction
      value: https://serviciosjava.afip.gob.ar/wscpe/autorizarCPEAutomotor
  body:
    type: xml
    data: |-
      <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:wsc="https://serviciosjava.afip.gob.ar/wscpe/">
          <soapenv:Header/>
          <soapenv:Body>
              <wsc:AutorizarCPEAutomotorReq>
                  <auth>
                      <token>{{TOKEN}}</token>
                      <sign>{{SIGN}}</sign>
                      <cuitRepresentada>30715118773</cuitRepresentada>
                  </auth>
                  <solicitud>
                      <cabecera>
                          <tipoCP>74</tipoCP>
                          <cuitSolicitante>30715118773</cuitSolicitante>
                          <sucursal>10</sucursal>
                          <nroOrden>{{ORDEN}}</nroOrden>
                      </cabecera>
                      <origen>
                          <operador>
                              <codProvincia>3</codProvincia>
                              <codLocalidad>34</codLocalidad>
                              <planta>3191</planta>
                          </operador>
                      </origen>
                      <correspondeRetiroProductor>false</correspondeRetiroProductor>
                      <esSolicitanteCampo>false</esSolicitanteCampo>
                      <datosCarga>
                          <codGrano>{{TIPO_GRANO}}</codGrano>
                          <cosecha>2122</cosecha>
                          <pesoBruto>20000</pesoBruto>
                          <pesoTara>15000</pesoTara>
                      </datosCarga>
                      <destino>
                          <cuit>30715118773</cuit>
                          <esDestinoCampo>false</esDestinoCampo>
                          <codProvincia>5</codProvincia>
                          <codLocalidad>287</codLocalidad>
                          <planta>3191</planta>
                      </destino>
                      <destinatario>
                          <cuit>{{CUIT_DESTINATARIO}}</cuit>
                      </destinatario>
                      <transporte>
                          <cuitTransportista>33707787959</cuitTransportista>
                          <dominio>{{PATENTE}}</dominio>
                          <fechaHoraPartida>{{FECHA_PARTIDA}}</fechaHoraPartida>
                          <kmRecorrer>155</kmRecorrer>
                          <codigoTurno>MOL7018/02012025</codigoTurno>
                          <cuitChofer>{{CUIT_CHOFER}}</cuitChofer>
                          <tarifa>285</tarifa>
                          <cuitPagadorFlete>30537699678</cuitPagadorFlete>
                          <cuitIntermediarioFlete>33707787959</cuitIntermediarioFlete>
                          <mercaderiaFumigada>true</mercaderiaFumigada>
                      </transporte>
                      <observaciones>Sin Observaciones</observaciones>
                  </solicitud>
              </wsc:AutorizarCPEAutomotorReq>
          </soapenv:Body>
      </soapenv:Envelope>
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "var jsonObject = xml2Json(res.getBody());\r

        console.log(jsonObject);\r

        \r

        var CTG = jsonObject['soap:Envelope']['soap:Body']['ns2:AutorizarCPEAutomotorResp']['respuesta']['cabecera']['nroCTG']\r

        \r

        console.log(CTG)"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

