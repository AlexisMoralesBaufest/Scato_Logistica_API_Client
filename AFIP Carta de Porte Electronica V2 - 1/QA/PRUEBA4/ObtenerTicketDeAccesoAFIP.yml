info:
  name: ObtenerTicketDeAccesoAFIP
  type: http
  seq: 1

http:
  method: GET
  url: "{{DOMAIN_AD}}/Scato.WebApiCore/AFIPApi/ObtenerTicketDeAccesoAFIP"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "var responseJson = res.getBody();\r

        \r

        var sign = responseJson.Data.Sign;\r

        var token = responseJson.Data.Token;\r

        var date = new Date();\r

        date.setDate(date.getDate() + 1);\r

        \r

        bru.setEnvVar(\"SIGN\", sign);\r

        bru.setEnvVar(\"TOKEN\", token);\r

        bru.setEnvVar( 'FECHA_PARTIDA', date.toISOString() )"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  This endpoint makes an HTTP GET request to retrieve the response of obtaining a ticket for access to AFIP. Below is the JSON schema for the response:

  ``` json
  {
    "type": "object",
    "properties": {
      "ticket": {
        "type": "string"
      },
      "expiration": {
        "type": "string",
        "format": "date-time"
      }
    }
  }

   ```
